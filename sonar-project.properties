# SonarQube analysis: `make sonar` (tests with coverage, then the scanner).
sonar.projectKey=halyk-genai-worker-request
sonar.projectName=worker.Request

sonar.sources=.
sonar.exclusions=**/*_test.go,deploy/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Generated by moq.
sonar.test.exclusions=**/*mock*_test.go

# Startup wiring: covered by the end-to-end runs, not by unit tests.
sonar.coverage.exclusions=main.go,internal/app/**
sonar.go.coverage.reportPaths=.sonar/coverage.out
sonar.go.tests.reportPaths=.sonar/tests.json

# Fail the scan when the quality gate fails.
sonar.qualitygate.wait=true
